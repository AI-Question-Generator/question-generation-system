services:
  # FastAPI Application
  fastapi:
    build:
      context: ..
      dockerfile: docker/qgs/Dockerfile
    container_name: fastapi
    ports:
      - "8000:8000"
    volumes:
      - fastapi_data:/app/assets/files
    networks:
      - backend
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy

  # Nginx Service
  nginx:
    image: nginx:stable-alpine3.23-perl
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - fastapi
    networks:
      - backend
    restart: always

  # MongoDB
  mongodb:
    image: mongo:7.0-jammy
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    env_file:
      - ./env/.env.mongodb
    
    networks:
      - backend
    
    restart: always
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --host localhost --port 27017
          -u "$${MONGO_INITDB_ROOT_USERNAME}" -p "$${MONGO_INITDB_ROOT_PASSWORD}"
          --authenticationDatabase admin --quiet --eval "db.adminCommand('ping').ok"
          | grep 1
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:12.3-ubuntu
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    env_file:
      - ./env/.env.grafana
    networks:
      - backend
    restart: always


  # Qdrant (VectorDB)
  qdrant:
    image: qdrant/qdrant:v1.17
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    restart: always
  
  # Node Exporter for system metrics
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - backend
    restart: always


  # MongoDB Exporter for mongodb metrics
  mongodb-exporter:
    image: percona/mongodb_exporter:0.49.0
    container_name: mongodb-exporter
    ports:
      - "9216:9216"
    env_file:
      - ./env/.env.mongodb-exporter
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
    restart: always

  
networks:
  backend:
    driver: bridge

volumes:
  fastapi_data:
  mongodata:
  qdrant_data:
  prometheus_data:
  grafana_data: